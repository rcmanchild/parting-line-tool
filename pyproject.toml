[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partingline"
version = "0.1.0"
description = "Lightweight parting-line analysis for injection/compression mold design (OpenCascade B-rep)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cadquery-ocp>=7.8,<7.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
# cadquery is only used to generate the synthetic test fixtures.
test = ["pytest>=7", "cadquery>=2.4"]

[project.scripts]
partingline = "partingline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
